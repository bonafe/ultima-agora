name: pages
#Publishes the static site (landing, hosting guide and the app itself) on GitHub Pages. No build: the repository IS the site.
#One-time setting: Settings → Pages → Source: "GitHub Actions". Without a sync server the app runs in local mode.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Keep only what the browser needs
        run: |
          mkdir _site
          cp -r index.html app.html hospedar.html sw.js precache.json site core collaboration conference transcription components ui vendor adapters _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
