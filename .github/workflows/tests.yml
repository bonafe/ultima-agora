name: tests
on: [push, pull_request]
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run browser tests (headless Chrome)
        run: tests/run.sh
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: MVP acceptance suite (several clients against the real agora-sync)
        run: tests/run_acceptance.sh
  sync-server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install and test agora-sync
        working-directory: server/agora-sync
        run: |
          npm install --no-audit --no-fund
          npm test
