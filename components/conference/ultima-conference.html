<link rel="stylesheet" href="ultima-conference.css">
<div id="notice" role="note" hidden></div>
<div id="errors" role="alert" hidden></div>
<section id="lobby" hidden>
    <p id="who" aria-live="polite"></p>
    <form id="join" autocomplete="off">
        <fieldset>
            <legend>Ao entrar, ligar:</legend>
            <label><input id="join-mic" type="checkbox"> Microfone</label>
            <label><input id="join-cam" type="checkbox"> Câmera</label>
        </fieldset>
        <p class="hint">Nada é ligado sem a sua escolha. Dá para entrar só para ouvir e assistir, e ligar depois.</p>
        <button id="enter" type="submit">Entrar na chamada</button>
    </form>
</section>
<section id="call" hidden>
    <div id="tiles" role="list" aria-label="Participantes da chamada"></div>
    <div id="controls" role="toolbar" aria-label="Controles da chamada">
        <button id="mic" type="button" aria-pressed="false">Microfone</button>
        <button id="cam" type="button" aria-pressed="false">Câmera</button>
        <button id="leave" type="button">Sair</button>
    </div>
    <div id="transcription" role="group" aria-label="Transcrição" hidden>
        <button id="transcribe" type="button" aria-pressed="false">Transcrever minha fala</button>
        <label class="sr-only" for="language">Idioma da transcrição</label>
        <select id="language"></select>
        <button id="open-transcript" type="button">Abrir transcrição</button>
        <p id="t-status" role="status" aria-live="polite"></p>
    </div>
    <div id="recording" role="group" aria-label="Gravação" hidden>
        <button id="record" type="button" aria-pressed="false">Gravar minha fala</button>
        <div id="record-consent" role="alertdialog" aria-labelledby="record-consent-text" hidden>
            <p id="record-consent-text">Isto grava só o seu áudio, o que sai do seu microfone, e envia ao workspace para quem tem acesso a ele. Todos na chamada vão ver que você está gravando. Você pode parar quando quiser.</p>
            <button id="record-yes" type="button">Gravar</button>
            <button id="record-no" type="button">Cancelar</button>
        </div>
        <button id="open-recordings" type="button">Abrir gravações</button>
        <p id="r-status" role="status" aria-live="polite"></p>
    </div>
</section>
