<link rel="stylesheet" href="ultima-recordings.css">
<div id="notice" role="note" hidden></div>
<div id="bar">
    <button id="refresh" type="button">Atualizar</button>
    <span id="transcript-label">Transcrição:</span>
    <button class="export" type="button" data-format="txt">.txt</button>
    <button class="export" type="button" data-format="vtt">.vtt</button>
    <button class="export" type="button" data-format="srt">.srt</button>
</div>
<p id="status" role="status" aria-live="polite"></p>
<ul id="list" aria-label="Gravações do workspace"></ul>
