# Same site over http (:80) and https (:443). The realtime server is reached at /sync/ on the SAME origin, so the
# browser needs to trust only one certificate, and the websocket becomes wss:// by itself.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    listen 443 ssl;
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache";                  # development: always revalidate
    # Cross-origin isolation: lets the in-browser Whisper use several CPU threads (SharedArrayBuffer). Everything the app
    # loads is from this same origin, so nothing breaks.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    location ~ ^/(\.git|server/|docker/) { return 404; }  # the repository is mounted as the site root: do not publish these

    location /sync/ {
        client_max_body_size 16m;                         # pieces of a recording are sent here (a few KB for audio, up to ~1 MB for video)
        proxy_request_buffering off;                      # and are passed on as they arrive
        proxy_pass http://sync:8787/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;                            # an idle websocket must not be cut
    }
}
